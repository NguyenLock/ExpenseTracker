# Render Blueprint. Database is Neon — do not add a Render Postgres service
# (the free one expires 30 days after creation).
# Docker context is the repo root. See Backend/Dockerfile.
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
